name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Chỉ build 1 tag để thử (vd 1.0). Để trống = build cả 15 tag (1.0 → 14.0, 14.5)"
        required: false
        default: ""
      base:
        description: "Hệ điều hành nền: debian (mặc định, chạy cả khi push) | ubuntu | both"
        required: false
        default: "debian"
        type: choice
        options: [debian, ubuntu, both]
permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 scripts/plan.py "${{ inputs.only }}" "${{ inputs.base }}"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # 1 bản lỗi không làm hỏng các bản còn lại
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng ổ đĩa
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ matrix.tags }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BASE=${{ matrix.base }}
            NODE=${{ matrix.node }}
            PYTHON=${{ matrix.python }}
            PHP=${{ matrix.php }}
            RUBY=${{ matrix.ruby }}
            GO=${{ matrix.go }}
            RUST=${{ matrix.rust }}
            JAVA=${{ matrix.java }}
            DOTNET=${{ matrix.dotnet }}
            KOTLIN=${{ matrix.kotlin }}
            DENO=${{ matrix.deno }}
            BUN=${{ matrix.bun }}
            SWIFT=${{ matrix.swift }}
            DART=${{ matrix.dart }}
            SCALA=${{ matrix.scala }}
            JULIA=${{ matrix.julia }}
            ZIG=${{ matrix.zig }}
